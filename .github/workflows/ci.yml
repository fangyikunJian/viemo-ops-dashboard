name: CI

# Every push and every pull request runs the same four checks the team runs
# locally. A branch that goes red here does not get merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real Postgres, because the integration tests run against one and the
    # migrations are Postgres migrations. Health-checked so the first step does
    # not race the container's startup.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: viemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/viemo

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      # `npm run typecheck` generates route types first. PageProps and
      # LayoutProps are written by Next.js at build time, so on a clean
      # checkout tsc cannot see them until typegen has run — which is exactly
      # the failure a developer never hits locally, because their .next
      # directory already has them.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Seed and verify the database
        # Proves the seed still runs against the current schema — the fastest
        # way to catch a migration that landed without its seed changes.
        run: npm run db:seed
